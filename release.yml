name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Unduh llama.cpp (Vulkan)
        shell: pwsh
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: ./scripts/get-llama.ps1 -Tag "${{ vars.LLAMA_TAG }}"
      - run: npm ci
      - name: Build dan publish ke GitHub Releases
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: npx electron-builder --win nsis --publish always